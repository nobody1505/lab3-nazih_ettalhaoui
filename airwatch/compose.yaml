services:
  api:
    build: .
    image: airwatch:1.0
    ports:
      - "8080:5000"
    environment:
      DATABASE_URL: postgresql://airwatch:${POSTGRES_PASSWORD}@db:5432/airwatch

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: airwatch
      POSTGRES_DB: airwatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airwatch -d airwatch"]
      interval: 5s
      timeout: 3s
      retries: 10


volumes:
  pgdata:
